[package]
name = "biotech"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { version = "0.15", features = ["multi_threaded"] }
rand = "0.8"

# Enable high optimizations for dependencies in dev mode to make Bevy run fast.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
